name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap init "GPS軌跡ロガー" "com.momo228v.gpsapp" --web-dir=.
      - run: npx cap add android
      - name: Open background settings for Android
        run: |
          sed -i '/<\/application>/i <service android:name="com.equimms.cordova.geolocation.ClearNotificationService" android:exported="false" \/><service android:name="com.equimms.cordova.geolocation.ForegroundService" android:foregroundServiceType="location" android:exported="false" \/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" \/>' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
